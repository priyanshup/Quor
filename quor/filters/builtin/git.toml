# quor built-in filter: git
# Compresses common git command output: status, log, diff, blame.
schema_version = 1

[[filter]]
name = "git-status"
match_command = '^git\s+status\b'

[[filter.stages]]
type = "strip_lines"
patterns = [
    '^  \(use "git',
    '^nothing to commit',
    '^nothing added to commit',
    '^no changes added to commit',
    '^On branch ',
    "^Your branch is up to date",
    "^Your branch is ahead",
]
preserve_patterns = [
    'modified:',
    'deleted:',
    'renamed:',
    'new file:',
    'conflict',
    'CONFLICT',
    'Unmerged',
]

[[filter.stages]]
type = "deduplicate_consecutive"

[[filter.tests]]
description = "Help hints stripped, modified files preserved"
input = "On branch main\n  (use \"git add\" to stage)\n\tmodified:   src/main.py"
must_contain = ["modified:   src/main.py"]
must_not_contain = ["use \"git add\""]

[[filter.tests]]
description = "Conflict lines always preserved"
input = "CONFLICT (content): Merge conflict in src/app.py\nAutomatic merge failed"
must_contain = ["CONFLICT"]

[[filter.tests]]
description = "Clean working tree notice stripped"
input = "On branch main\nnothing to commit, working tree clean"
must_not_contain = ["nothing to commit"]

[[filter]]
name = "git-log"
match_command = '^git\s+log\b'

[[filter.stages]]
type = "strip_lines"
patterns = [
    '^Author:',
    '^Date:',
    '^Merge:',
]
preserve_patterns = [
    'commit ',
    'fix',
    'feat',
    'BREAKING',
]

[[filter.stages]]
type = "max_tokens"
limit = 400
strategy = "head"

[[filter.tests]]
description = "Author and date stripped, commit hash preserved"
input = "commit abc1234\nAuthor: Dev <dev@example.com>\nDate:   Mon Jan 1 00:00:00 2024\n\n    feat: add feature"
must_contain = ["commit abc1234", "feat: add feature"]
must_not_contain = ["Author:", "Date:"]

[[filter.tests]]
description = "BREAKING change line always preserved"
input = "commit def5678\nAuthor: Dev <dev@example.com>\n\n    BREAKING CHANGE: removed old API"
must_contain = ["BREAKING CHANGE"]

[[filter.tests]]
description = "Head strategy keeps earliest commits"
input = "commit aaa0001\n\n    first commit\ncommit bbb0002\n\n    second commit"
must_contain = ["commit aaa0001"]

[[filter]]
name = "git-diff"
match_command = '^git\s+(diff|show)\b'
# QB-109: content_type.detect() classifies real diff/show output as DIFF via
# an exact structural check (a line starting with "diff --git "/"--- a/"/
# "+++ b/"/"@@ "), not a guessed heuristic — safe to use as a fallback
# selector for MCP's compress_context, which has no command string to match
# match_command against at all (see FilterRegistry.find()'s own docstring).
match_content_types = ["diff"]

[[filter.stages]]
# QB-041: must run before strip_lines. Some real diff shapes (a mode-only
# change, a newly added empty file, a deleted-while-empty file) emit no
# "--- a/"/"+++ b/"/"rename from "/"rename to "/"Binary files " line at
# all — the "diff --git a/X b/X" header is the *only* line naming the file
# in those segments. This stage PROTECTs that header line for exactly those
# segments, before strip_lines' own "^diff --git " pattern would otherwise
# remove it unconditionally. A no-op for every other diff shape, since a
# normal content change, rename, and binary diff all already carry a
# filename elsewhere in their own segment.
type = "protect_diff_filename_headers"

[[filter.stages]]
type = "strip_lines"
# QB-109: `--- a/`/`+++ b/` are deliberately absent from `patterns` below.
# They used to be listed there, but strip_lines checks preserve_patterns
# first (see that stage's own docstring) and `^\+`/`^-` below already match
# `+++ b/...`/`--- a/...` too — those two entries never fired, dead code.
# That collision is load-bearing, not a bug to fix: since `diff --git a/X
# b/X` IS stripped, `--- a/`/`+++ b/` are the only place a filename survives
# in compressed output. Actually stripping them (e.g. by tightening `^\+`/
# `^-` to exclude them) would leave multi-file diffs with no way to tell
# which file a hunk belongs to — see the "filenames survive" test below,
# which pins this behavior against a future well-intentioned cleanup.
patterns = [
    '^index ',
    '^diff --git ',
    '^ $',
]
preserve_patterns = [
    '^\+',
    '^-',
    '^@@',
    '^rename from ',
    '^rename to ',
    '^similarity index ',
]

[[filter.stages]]
type = "collapse_unchanged_context"
context_lines = 1

[[filter.stages]]
type = "deduplicate_consecutive"

[[filter.stages]]
type = "max_tokens"
limit = 600
strategy = "both"

[[filter.tests]]
description = "Index header stripped, hunk header preserved"
input = "diff --git a/foo.py b/foo.py\nindex abc..def 100644\n--- a/foo.py\n+++ b/foo.py\n@@ -1,3 +1,4 @@\n+new line"
must_contain = ["@@ -1,3 +1,4 @@", "+new line"]
must_not_contain = ["index abc..def"]

[[filter.tests]]
description = "Added and removed lines preserved"
input = "@@ -1,2 +1,2 @@\n-old line\n+new line\n context"
must_contain = ["-old line", "+new line"]

[[filter.tests]]
description = "Blank context lines stripped"
input = "@@ -1,3 +1,3 @@\n context line\n \n+added line"
must_contain = ["context line", "+added line"]

[[filter.tests]]
description = "Long unchanged context run collapsed, edits and window preserved"
input = "@@ -1,20 +1,20 @@\n context line 1\n context line 2\n context line 3\n context line 4\n context line 5\n context line 6\n context line 7\n context line 8\n context line 9\n context line 10\n-old line\n+new line"
must_contain = [
    "@@ -1,20 +1,20 @@",
    "context line 1",
    "unchanged lines omitted",
    "context line 10",
    "-old line",
    "+new line",
]
must_not_contain = ["context line 2", "context line 5", "context line 9"]

[[filter.tests]]
description = "Short unchanged context run cheaper than placeholder left untouched"
input = "@@ -1,5 +1,5 @@\n context line 1\n context line 2\n context line 3\n context line 4\n-old line\n+new line"
must_contain = ["context line 1", "context line 2", "context line 3", "context line 4", "-old line", "+new line"]
must_not_contain = ["unchanged lines omitted"]

[[filter.tests]]
description = "Max in-hunk gap between two nearby edits collapsed (git -U3 merges hunks up to a 6-line gap)"
input = "@@ -10,17 +10,17 @@ class OrderProcessor:\n     def process(self, order):\n         self._validate(order)\n         self._log_start(order)\n-        result = self._legacy_handler(order)\n+        result = self._new_handler(order, strict=True)\n         self._emit_metrics(result)\n         self._notify_downstream(result)\n         self._update_inventory(result)\n         self._record_audit_trail(order, result)\n         self._flush_pending_writes()\n         self._release_lock(order.lock_id)\n-        return result\n+        return result if result.ok else None\n     def _validate(self, order):\n         if not order.items:\n             raise ValueError(\"empty order\")"
must_contain = [
    "self._legacy_handler(order)",
    "self._new_handler(order, strict=True)",
    "4 unchanged lines omitted",
    "self._release_lock(order.lock_id)",
    "return result if result.ok else None",
]
must_not_contain = ["_notify_downstream", "_update_inventory", "_record_audit_trail"]

[[filter.tests]]
description = "QB-041 evidence fix: unchanged context line merely mentioning \"Error\" (e.g. an exception class name) is not force-protected and still collapses as part of a long unchanged run"
input = "@@ -1,15 +1,16 @@\n-        old_value = compute(order)\n+        old_value = compute(order, strict=True)\n         if amount <= 0:\n             raise ValueError(\"negative amounts not allowed\")\n         context line 2\n         context line 3\n         context line 4\n         context line 5\n         context line 6\n         context line 7\n         context line 8\n-        return old_value\n+        return old_value if old_value.ok else None"
must_contain = [
    "old_value = compute(order)",
    "old_value = compute(order, strict=True)",
    "unchanged lines omitted",
    "context line 8",
    "return old_value if old_value.ok else None",
]
must_not_contain = ["raise ValueError", "context line 2", "context line 5"]

[[filter.tests]]
description = "QB-055 regression: rename metadata never collapsed by the token-cost gate"
input = "diff --git a/src/notifications/legacy_channels.py b/src/notifications/channels.py\nsimilarity index 61%\nrename from src/notifications/legacy_channels.py\nrename to src/notifications/channels.py\nindex 2d3e4f5..6a7b8c9 100644\n--- a/src/notifications/legacy_channels.py\n+++ b/src/notifications/channels.py\n@@ -1,3 +1,3 @@\n class EmailChannel:\n-    def send_legacy(self, event):\n+    def send(self, event):"
must_contain = [
    "similarity index 61%",
    "rename from src/notifications/legacy_channels.py",
    "rename to src/notifications/channels.py",
]
must_not_contain = ["unchanged lines omitted"]

[[filter.tests]]
description = "QB-109 regression: every changed file's name survives compression in a multi-file diff, even though diff --git is stripped — --- a/ and +++ b/ are the only remaining filename carrier and must never be silently stripped by a future preserve_patterns/patterns cleanup"
input = "diff --git a/src/alpha.py b/src/alpha.py\nindex 111..222 100644\n--- a/src/alpha.py\n+++ b/src/alpha.py\n@@ -1,2 +1,2 @@\n-old alpha\n+new alpha\ndiff --git a/src/beta.py b/src/beta.py\nindex 333..444 100644\n--- a/src/beta.py\n+++ b/src/beta.py\n@@ -1,2 +1,2 @@\n-old beta\n+new beta"
must_contain = [
    "src/alpha.py",
    "src/beta.py",
    "new alpha",
    "new beta",
]

[[filter.tests]]
description = "QB-041: mode-only change (chmod) preserves the filename — no --- a/ or +++ b/ line exists for a mode-only diff, so diff --git is the only filename carrier"
input = "diff --git a/deploy.sh b/deploy.sh\nold mode 100644\nnew mode 100755"
must_contain = ["deploy.sh", "old mode 100644", "new mode 100755"]

[[filter.tests]]
description = "QB-041: newly added empty file preserves the filename — git emits no --- /dev/null / +++ b/ pair when the new file has zero content"
input = "diff --git a/empty.txt b/empty.txt\nnew file mode 100644\nindex 0000000..e69de29"
must_contain = ["empty.txt", "new file mode 100644"]

[[filter.tests]]
description = "QB-041: deleted empty file preserves the filename — same reasoning as the newly-added-empty-file case, in reverse"
input = "diff --git a/empty.txt b/empty.txt\ndeleted file mode 100644\nindex e69de29..0000000"
must_contain = ["empty.txt", "deleted file mode 100644"]

[[filter.tests]]
description = "QB-041 regression: a normal content-change diff still strips its diff --git header — protect_diff_filename_headers must not protect a header that already has a --- a/ / +++ b/ filename carrier, or every file in an ordinary diff would show its path twice"
input = "diff --git a/foo.py b/foo.py\nindex abc..def 100644\n--- a/foo.py\n+++ b/foo.py\n@@ -1,3 +1,4 @@\n+new line"
must_not_contain = ["diff --git"]
must_contain = ["--- a/foo.py", "+++ b/foo.py"]

[[filter]]
# QB-101: `git branch -vv` right-pads the branch-name and hash columns so
# the upstream/subject columns line up — genuinely tabular, and git itself
# is already a fully-routed base command (_KNOWN_BASE_COMMANDS), so this is
# live the moment it ships, unlike the docker/kubectl/unix candidates below.
# `patterns` declares the exact row shape this filter knows to expect
# (current-branch marker, branch name, a 7-40 hex short/full SHA) rather
# than guessing "looks tabular" — same convention path_prefix_fold/
# strip_lines use. `git branch` with no `-v`/`-vv` has no hash column at
# all and simply never matches; harmless no-op, not a separate filter.
name = "git-branch"
match_command = '^git\s+branch\b'

[[filter.stages]]
# max_gaps = 1: only the name-to-hash gap is a real column separator in
# real git output (git does not right-pad the hash or anything after it).
# Bounding here is a hard guarantee, not a probabilistic one — the commit
# subject frequently contains its own multiple-space runs (double-spacing
# after a period is common style), which must never be touched.
type = "column_padding_compression"
patterns = ['^[* ] \S+\s+[0-9a-f]{7,40}(\s|$)']
max_gaps = 1

[[filter.tests]]
description = "QB-101: git branch -vv column padding collapsed; current-branch marker and every field preserved"
input = "* main                a1b2c3d [origin/main] Merge pull request #99\n  feature/qb-101-cols  b2c3d4e [origin/feature/qb-101-cols: ahead 3] Add column padding stage"
must_contain = ["* main a1b2c3d [origin/main] Merge pull request #99", "feature/qb-101-cols b2c3d4e [origin/feature/qb-101-cols: ahead 3] Add column padding stage"]
must_not_contain = ["main                a1b2c3d"]

[[filter.tests]]
description = "QB-101: current-branch marker column (leading '* ' vs two spaces) is leading whitespace, never touched"
input = "* main            a1b2c3d Initial commit\n  old-branch       c3d4e5f Old experiment"
must_contain = ["* main a1b2c3d Initial commit", "  old-branch c3d4e5f Old experiment"]

[[filter.tests]]
description = "QB-101: a commit subject with its own double-spacing (common after a period) survives past max_gaps=1 untouched"
input = "* main                a1b2c3d Fix bug.  Also update docs.  See #42."
must_contain = ["Fix bug.  Also update docs.  See #42."]

[[filter.tests]]
description = "QB-101: plain `git branch` (no -v, no hash column) has nothing matching the declared row shape and passes through untouched"
input = "* main\n  feature/other"
must_contain = ["* main", "  feature/other"]
