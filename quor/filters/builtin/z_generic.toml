# quor built-in filter: generic
# Fallback filter: remove ANSI noise, deduplicate, and cap token count.
# Matches everything — must be last in any tier so specific filters win.
schema_version = 1

[[filter]]
name = "generic"
match_command = '.'

[[filter.stages]]
# strip_inline (QB-119): also strip ANSI codes embedded alongside real text
# (e.g. colorized "PASSED"/"FAILED" test-runner output), not just lines
# that are pure ANSI — see remove_ansi.py's own docstring for why this is
# an opt-in field rather than the default.
type = "remove_ansi"
strip_inline = true

[[filter.stages]]
# Stack trace frame dedup (docs/archive/product-discovery/competitive-research.md
# Opportunity 6): any command can crash with an unhandled Python exception —
# a raw script, a Flask/Django dev server, etc. — not just pytest, which has
# its own copy of this same stage in pytest.toml. Only the frame header line
# is stripped; its indented source-code line has no distinguishing marker of
# its own and is left as-is (Safety Rule #3: when uncertain, keep it).
type = "strip_lines"
patterns = [
    '(?i)^\s*File "[^"]*(?:site-packages|dist-packages)[^"]*", line \d+, in',
]
preserve_patterns = [
    'Traceback',
    'Error',
    'Exception',
]

[[filter.stages]]
# show_count (QB-119): rewrite a collapsed run's anchor line with a visible
# "(xN)" suffix instead of silently dropping the repeat count — see
# deduplicate_consecutive.py's own docstring for why this is opt-in.
type = "deduplicate_consecutive"
show_count = true

[[filter.stages]]
# QB-098: rewrite consecutive timestamp-prefixed lines (docker/kubectl
# `--timestamps` logs, ISO-mode journalctl, application logs, generic CI
# console output — none of which have a dedicated filter, so they all land
# here) to per-line "+delta" prefixes. Runs before path_prefix_fold/
# numeric_range_compression: a rewritten "+1s ..." line is never itself a
# path-like or bare-integer candidate, so ordering relative to those two
# doesn't matter for correctness, but running the timestamp-shape check
# first keeps this filter's "recognize a known line shape, narrowest first"
# stages grouped together, mirroring how ci.toml's github-actions filter
# also normalizes its own timestamp prefix early, right after remove_ansi.
# No `patterns` config, same reasoning as numeric_range_compression: a line
# either matches one of this stage's fixed timestamp shapes or it doesn't —
# there's no ambiguous "looks like a timestamp" judgment call to scope with
# a filter-author regex.
type = "relative_timestamp_compression"

[[filter.stages]]
# QB-095: fold consecutive path-like lines (find/ripgrep --files/ls -R/
# coverage listings, repo maps, etc.) sharing a directory prefix. Deliberately
# narrow, anchored pattern — the whole line must be one non-whitespace token
# containing at least one "/" — because a false negative here just declines a
# fold (harmless), while the fold itself is lossless/reconstructible even if
# applied to a line that isn't really a path, so there's no real downside to
# keeping this permissive; anchoring to the whole line is what keeps it from
# firing on prose that merely mentions a path. Runs before max_tokens so the
# tail-truncation budget below applies to the already-folded content.
type = "path_prefix_fold"
patterns = ['^\S+/\S*$']
separator = "/"

[[filter.stages]]
# QB-097: fold consecutive standalone-integer lines (line-number listings,
# coverage/warning/test/issue IDs, log sequence numbers) into an inclusive
# range. Runs after path_prefix_fold so a numeric suffix path_prefix_fold
# just produced (e.g. "run/42"/"run/43" -> header + "42"/"43") is itself a
# candidate for further folding, and before max_tokens for the same reason
# path_prefix_fold is: the tail-truncation budget below should apply to the
# already-folded content, not the other way around. No `patterns` config —
# "the whole line is nothing but digits" is a precise structural check, not
# a shape guess, so unlike path_prefix_fold there is no ambiguity for a
# filter author to scope with a regex.
type = "numeric_range_compression"

[[filter.stages]]
type = "max_tokens"
limit = 1000
strategy = "tail"

[[filter.tests]]
description = "Consecutive duplicate lines deduplicated"
input = "same line\nsame line\ndifferent line"
must_contain = ["same line", "different line"]

[[filter.tests]]
description = "Unique lines all preserved"
input = "line_a\nline_b\nline_c"
must_contain = ["line_a", "line_b", "line_c"]

[[filter.tests]]
description = "Content within token limit unchanged"
input = "short output"
must_contain = ["short output"]

[[filter.tests]]
description = "Framework traceback frames stripped for a non-pytest crash (e.g. Flask dev server); user frame and exception preserved"
input = "Traceback (most recent call last):\n  File \"/home/user/myproject/app.py\", line 10, in <module>\n    main()\n  File \"/usr/lib/python3.11/site-packages/flask/app.py\", line 1234, in wsgi_app\n    response = self.full_dispatch_request()\nZeroDivisionError: division by zero"
must_contain = ["Traceback", "app.py\", line 10, in <module>", "ZeroDivisionError"]
must_not_contain = ["site-packages/flask"]

[[filter.tests]]
description = "QB-095: path-heavy listing (find/rg --files/ls -R style) folded to a shared-prefix header"
input = "src/quor/pipeline/stages/foo.py\nsrc/quor/pipeline/stages/bar.py\nsrc/quor/pipeline/stages/baz.py"
must_contain = ["src/quor/pipeline/stages/ (3 entries):", "foo.py", "bar.py", "baz.py"]
must_not_contain = ["src/quor/pipeline/stages/foo.py"]

[[filter.tests]]
description = "QB-095: non-path output is never touched by path_prefix_fold"
input = "hello\nworld\nfoo"
must_contain = ["hello", "world", "foo"]
must_not_contain = ["entries):"]

[[filter.tests]]
description = "QB-095: short path-like run left unfolded when the header wouldn't pay for itself"
input = "src/a.py\nsrc/b.py"
must_contain = ["src/a.py", "src/b.py"]
must_not_contain = ["entries):"]

[[filter.tests]]
description = "QB-097: a long run of consecutive line numbers folds to a range"
input = "Errors on lines:\n201\n202\n203\n204\n205"
must_contain = ["Errors on lines:", "201-205"]
must_not_contain = ["202", "203", "204"]

[[filter.tests]]
description = "QB-097: non-consecutive numbers and non-numeric output are never touched"
input = "hello\n1\n3\n5\nworld"
must_contain = ["hello", "1", "3", "5", "world"]
must_not_contain = ["-"]

[[filter.tests]]
description = "QB-097: a short run left unfolded when the range wouldn't pay for itself"
input = "42\n43"
must_contain = ["42", "43"]
must_not_contain = ["42-43"]

[[filter.tests]]
description = "QB-098: docker/kubectl `--timestamps`-style ISO log lines fold to per-line deltas; first line's absolute timestamp survives"
input = "2026-07-31T10:15:01.000000000Z INFO Starting server\n2026-07-31T10:15:02.000000000Z INFO Loading plugins\n2026-07-31T10:15:03.000000000Z INFO Ready\n2026-07-31T10:15:04.000000000Z INFO Listening on :8080"
must_contain = ["2026-07-31T10:15:01.000000000Z INFO Starting server", "+1s INFO Loading plugins", "+1s INFO Ready", "+1s INFO Listening on :8080"]
must_not_contain = ["2026-07-31T10:15:02.000000000Z", "2026-07-31T10:15:03.000000000Z", "2026-07-31T10:15:04.000000000Z"]

[[filter.tests]]
description = "QB-098: application-log space-separated datetime prefixes fold the same way"
input = "2026-07-31 10:15:01 INFO Starting server\n2026-07-31 10:15:02 INFO Loading plugins\n2026-07-31 10:15:03 INFO Ready"
must_contain = ["2026-07-31 10:15:01 INFO Starting server", "+1s INFO Loading plugins", "+1s INFO Ready"]
must_not_contain = ["2026-07-31 10:15:02", "2026-07-31 10:15:03"]

[[filter.tests]]
description = "QB-098: non-timestamp output is never touched by relative_timestamp_compression"
input = "hello\nworld\nfoo"
must_contain = ["hello", "world", "foo"]
must_not_contain = ["+0s", "+1s"]

[[filter.tests]]
description = "QB-098: a single timestamped line has nothing to fold against and is left unchanged"
input = "just one line\n2026-07-31 10:15:01 INFO solo event\nafter"
must_contain = ["2026-07-31 10:15:01 INFO solo event"]

[[filter.tests]]
description = "QB-119: ANSI codes embedded alongside real text are stripped inline, not just pure-ANSI lines"
input = "\u001b[32mPASSED\u001b[0m tests/test_foo.py"
must_contain = ["PASSED tests/test_foo.py"]
must_not_contain = ["\u001b[32m", "\u001b[0m"]

[[filter.tests]]
description = "QB-119: consecutive duplicate lines collapse to a visible (xN) count instead of vanishing silently"
input = "build tick\nbuild tick\nbuild tick\nbuild tick\ndone"
must_contain = ["build tick (×4)", "done"]

[[filter.tests]]
description = "QB-119: a real error message is never swept into an unrelated duplicate run"
input = "retrying\nretrying\nAssertionError: expected 200, got 500\nretrying\nretrying"
must_contain = ["retrying (×2)", "AssertionError: expected 200, got 500"]
