schema_version = 1

# Framework detection: scoped to dependency-name mentions inside manifest/
# requirement files only (never a scan of arbitrary source files for
# import statements) — bounded to a handful of small, well-known files per
# repo, and every match is a real, verifiable dependency declaration.

[[detector]]
name = "flask"
category = "framework"
match_basename = ["requirements.txt", "pyproject.toml", "Pipfile", "setup.py"]
match_content = ['(?mi)^\s*flask\b', '(?i)"flask\b', '(?i)\x27flask\b']
evidence = "flask dependency declared"

